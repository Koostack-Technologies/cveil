# Semantic Release — Core (API + platform modules)
# Tags: v1.0.0, v1.1.0, etc.

tagFormat: "v${version}"

branches:
  - main

plugins:
  - - "@semantic-release/commit-analyzer"
    - releaseRules:
        # Exclude SDK/CLI scoped commits from core release
        - scope: sdk-java
          release: false
        - scope: sdk-js
          release: false
        - scope: cli
          release: false
        # Standard rules for everything else
        - type: feat
          release: minor
        - type: fix
          release: patch
        - type: perf
          release: patch
        - type: revert
          release: patch

  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits

  - - "@semantic-release/changelog"
    - changelogFile: CHANGELOG.md

  - - "@semantic-release/git"
    - assets:
        - CHANGELOG.md
      message: "chore(core): release v${nextRelease.version} [skip ci]"

  - "@semantic-release/github"
