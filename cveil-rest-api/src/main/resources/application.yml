# =============================================================================
# Cveil REST API — Quarkus Configuration
#
# This is the cloud deployment REST API configuration.  Virtual threads MUST
# be enabled so that ScopedValue-based TenantContext and RequestContext work
# correctly (ScopedValue requires structured thread-per-request semantics).
# =============================================================================

quarkus:
  http:
    port: 8080
    cors:
      origins: ${CVEIL_CORS_ORIGINS:https://dashboard.cveil.dev}
      methods: ${CVEIL_CORS_METHODS:GET,POST,DELETE,OPTIONS}
      headers: ${CVEIL_CORS_HEADERS:Authorization,Content-Type,X-Request-Id,DPoP,X-Org-Id}
      exposed-headers: ${CVEIL_CORS_EXPOSED_HEADERS:X-Request-Id,X-RateLimit-Limit,X-RateLimit-Remaining,X-RateLimit-Reset,X-RateLimit-Warning,DPoP-Nonce}
  virtual-threads:
    enabled: true # REQUIRED for ScopedValue (TenantContext, RequestContext)

  # ---------------------------------------------------------------------------
  # CDI / ArC — index cveil-core so generic plugin types are resolvable
  # ---------------------------------------------------------------------------
  arc:
    # cveil-core contains generic SPI interfaces (CoreCommandService<T>, etc.)
    # that are returned by @Produces methods. ArC needs the Jandex index to
    # resolve parameterized bean types from non-application JARs.
    unremovable-types: com.koostack.cveil.core.platform.**
  index-dependency:
    cveil-core:
      group-id: com.koostack.cveil
      artifact-id: cveil-core

  # ---------------------------------------------------------------------------
  # OpenAPI & Swagger UI
  # ---------------------------------------------------------------------------
  # The built-in Swagger UI at /q/swagger-ui is disabled in favor of the
  # split docs served by TenantDocsResource (/api/v1/docs) and
  # PlatformDocsResource (/api/v1/platform/docs).  The /q/openapi spec
  # endpoint is kept so that OpenApiSplitService can read the full model.
  smallrye-openapi:
    path: /q/openapi # OpenAPI spec endpoint (YAML/JSON) — used by split service
    info-title: Cveil Consent Management API
    info-version: 1.0.0
  swagger-ui:
    always-include: false # Disabled — use /api/v1/docs and /api/v1/platform/docs instead

# -----------------------------------------------------------------------------
# Cveil SDK configuration — read by CveilProducers CDI bean
# =============================================================================
# HIPAA & GDPR Compliance Notes:
#
# - Redis credentials (ACL passwords) must be encrypted in transit (TLS).
# - Consent data (subject IDs, field names) must be encrypted in transit (TLS).
# - Database connections must use TLS for compliance with:
#   * HIPAA §164.312(a)(2)(ii) — encryption in transit
#   * GDPR Article 32 — technical measures for data security
#
# For production deployments:
#
#   1. cveil.db.ssl-mode: set to "verify-full" or "verify-ca"
#   2. cveil.db.ssl-cert-path: mount a PEM CA certificate file
#   3. cveil.redis.tls-enabled: set to true
#   4. cveil.redis.tls-ca-cert-path: mount a PEM CA certificate file
#
# For local development, the defaults (ssl-mode=require, tls-enabled=false)
# allow unencrypted connections for simplicity.
# =============================================================================
cveil:
  mode: production # or "embedded" for local dev
  app-name: cveil # application name for Redis key namespacing
  db:
    url: jdbc:postgresql://localhost:5432/cveil
    dialect: POSTGRES
    username: ${CVEIL_DB_USERNAME:}
    password: ${CVEIL_DB_PASSWORD:}
    encryption-key: ${CVEIL_DB_ENCRYPTION_KEY:}
    ssl-mode: ${CVEIL_DB_SSL_MODE:require} # disable, require, verify-ca, verify-full
    ssl-cert-path: ${CVEIL_DB_SSL_CERT_PATH:} # path to PEM CA certificate
    ssl-key-path: ${CVEIL_DB_SSL_KEY_PATH:} # path to PEM client key (for mTLS)
  redis:
    host: localhost
    port: 6379
    password: ${CVEIL_REDIS_PASSWORD:} # optional
    tls-enabled: ${CVEIL_REDIS_TLS_ENABLED:false} # set to true for production with TLS
    tls-ca-cert-path: ${CVEIL_REDIS_TLS_CA_CERT_PATH:} # path to PEM CA certificate
    tls-verify-peer: ${CVEIL_REDIS_TLS_VERIFY_PEER:true} # verify server certificate
  super-admin:
    bootstrap-key: ${CVEIL_BOOTSTRAP_KEY:}
    force-bootstrap: ${CVEIL_FORCE_BOOTSTRAP:false}

  # ---------------------------------------------------------------------------
  # Multi-Tenant Isolation
  # ---------------------------------------------------------------------------
  # When enabled, DSAR endpoints (export and delete) require an active
  # TenantContext and return 403 Forbidden if none is set.  All database
  # queries are automatically routed to the correct per-tenant schema via
  # TenantAwareExecuteListener (SET search_path TO t_{tenantId}, public).
  #
  # Set to true for multi-tenant SaaS deployments.  Defaults to false for
  # backward compatibility with single-tenant installations.
  multi-tenant:
    enabled: ${CVEIL_MULTI_TENANT_ENABLED:false}
