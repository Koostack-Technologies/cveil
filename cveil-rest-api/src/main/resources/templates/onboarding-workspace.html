{#include base.html}
{#title}Name Your Organization{/title}
{#head}
{/head}
{#content}

    <main class="relative z-10 flex-grow flex flex-col items-center justify-center px-4 sm:px-6 lg:px-8 pt-12 sm:pt-20 pb-16 sm:pb-20">
        <div class="w-full max-w-lg">

            <!-- Step indicator -->
            <div class="flex items-center justify-center gap-2 mb-8 text-sm text-gray-500">
                <span class="flex items-center gap-1.5 text-cv-500 font-medium">
                    <span class="w-6 h-6 rounded-full bg-cv-500 text-gray-900 flex items-center justify-center text-xs font-bold">1</span>
                    Organization
                </span>
                <span class="w-8 h-px bg-gray-700"></span>
                <span class="flex items-center gap-1.5">
                    <span class="w-6 h-6 rounded-full border border-gray-600 flex items-center justify-center text-xs">2</span>
                    Industry
                </span>
                <span class="w-8 h-px bg-gray-700"></span>
                <span class="flex items-center gap-1.5">
                    <span class="w-6 h-6 rounded-full border border-gray-600 flex items-center justify-center text-xs">3</span>
                    Compliance
                </span>
            </div>

            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-center mb-3">
                Name your organization
            </h1>
            <p class="text-gray-400 text-center text-lg mb-10">
                This is where your team's consent data lives.
            </p>

            {#if error}
            <div class="mb-6 rounded border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-400">
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>{error}</span>
                </div>
            </div>
            {/if}

            <form method="POST" action="/onboarding" class="space-y-6">
                <!-- Organization name -->
                <div>
                    <label for="workspaceName" class="block text-sm font-medium text-gray-300 mb-2">Organization name</label>
                    <input type="text" id="workspaceName" name="workspaceName"
                           value="{workspaceName ?: ''}"
                           placeholder="e.g. Acme Health, KooStack Technologies"
                           required minlength="2" maxlength="100"
                           class="w-full bg-gray-800/50 border border-gray-700 rounded px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-cv-500 focus:ring-1 focus:ring-cv-500 transition-colors">
                    <p class="mt-1.5 text-xs text-gray-500">You can change this later in settings.</p>
                </div>

                <!-- Submit -->
                <button type="submit"
                        class="w-full bg-cv-500 text-gray-900 hover:bg-cv-600 px-6 py-3.5 rounded font-semibold text-lg transition-all shadow-[0_0_20px_rgba(20,184,166,0.3)] flex items-center justify-center gap-2">
                    Continue
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                </button>
            </form>

        </div>
    </main>

{/content}
{/include}
