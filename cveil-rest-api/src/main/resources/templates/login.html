{#include base.html}
{#title}Log In{/title}
{#content}

    <main class="relative z-10 flex-grow flex flex-col items-center justify-center px-4 sm:px-6 lg:px-8 pt-12 sm:pt-20 pb-16 sm:pb-20">
        <div class="w-full max-w-md">

            <div class="text-center mb-8">
                <h1 class="text-3xl sm:text-4xl font-bold tracking-tight mb-3">Welcome back</h1>
                <p class="text-gray-400">Sign in to your Cveil workspace.</p>
            </div>

            <div id="login-error" class="mb-6 rounded border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-400 hidden">
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span id="login-error-msg"></span>
                </div>
            </div>

            {#if error}
            <div class="mb-6 rounded border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-400">
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>{error}</span>
                </div>
            </div>
            {/if}

            <form id="login-form" method="POST" action="/login" class="space-y-5">

                <div>
                    <label for="identifier" class="block text-sm font-medium text-gray-300 mb-1.5">Email or Username <span class="text-red-400">*</span></label>
                    <input type="text" id="identifier" name="identifier" required
                           value="{identifier ?: ''}"
                           placeholder="you@company.com or janedoe"
                           class="w-full rounded border border-gray-700 bg-gray-800/60 px-4 py-2.5 text-white placeholder-gray-500 text-sm focus:border-cv-500 focus:ring-1 focus:ring-cv-500 outline-none transition-colors">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-1.5">Password <span class="text-red-400">*</span></label>
                    <input type="password" id="password" name="password" required
                           placeholder="Enter your password"
                           class="w-full rounded border border-gray-700 bg-gray-800/60 px-4 py-2.5 text-white placeholder-gray-500 text-sm focus:border-cv-500 focus:ring-1 focus:ring-cv-500 outline-none transition-colors">
                </div>

                <button type="submit" id="login-btn"
                        class="w-full bg-cv-500 text-gray-900 hover:bg-cv-600 px-6 py-3 rounded font-semibold text-base transition-all shadow-[0_0_20px_rgba(20,184,166,0.3)] mt-2">
                    Sign In
                </button>
            </form>

            <p class="mt-6 text-center text-sm text-gray-500">
                Don't have an account?
                <a href="/signup" class="text-cv-500 hover:text-cv-600 font-medium transition-colors">Sign up</a>
            </p>

        </div>
    </main>

    <script type="module">

    const DPOP_STORAGE_KEY = 'cveil_dpop_jwk';
    const ALG = 'ES256';

    async function initDpopKeys() {
        const stored = sessionStorage.getItem(DPOP_STORAGE_KEY);
        if (stored) {
            try {
                // Validate stored JWK is parseable
                JSON.parse(stored);
                return;
            } catch { sessionStorage.removeItem(DPOP_STORAGE_KEY); }
        }
        const kp = await crypto.subtle.generateKey(
            { name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
        const fullJwk = await crypto.subtle.exportKey('jwk', kp.privateKey);
        sessionStorage.setItem(DPOP_STORAGE_KEY, JSON.stringify(fullJwk));
    }

    async function createDpopProof(method, url) {
        const fullJwk = JSON.parse(sessionStorage.getItem(DPOP_STORAGE_KEY));
        const { d, ...publicJwk } = fullJwk;
        const privateKey = await crypto.subtle.importKey(
            'jwk', fullJwk, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign']);

        const parsed = new URL(url);
        const htu = parsed.origin + parsed.pathname;

        const header = { alg: ALG, typ: 'dpop+jwt', jwk: publicJwk };
        const payload = {
            htm: method.toUpperCase(),
            htu,
            jti: crypto.randomUUID(),
            iat: Math.floor(Date.now() / 1000)
        };

        const enc = new TextEncoder();
        function toBase64Url(str) {
            const bytes = enc.encode(str);
            let binary = '';
            for (const b of bytes) binary += String.fromCharCode(b);
            return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
        }
        const headerB64 = toBase64Url(JSON.stringify(header));
        const payloadB64 = toBase64Url(JSON.stringify(payload));
        const sigInput = enc.encode(headerB64 + '.' + payloadB64);

        const sigBuf = await crypto.subtle.sign(
            { name: 'ECDSA', hash: 'SHA-256' }, privateKey, sigInput);

        // Web Crypto API returns IEEE P1363 format (raw r||s, 64 bytes for P-256)
        const sigBytes = new Uint8Array(sigBuf);
        const sigB64 = btoa(String.fromCharCode(...sigBytes))
            .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

        return headerB64 + '.' + payloadB64 + '.' + sigB64;
    }

    function showError(msg) {
        const el = document.getElementById('login-error');
        const msgEl = document.getElementById('login-error-msg');
        msgEl.textContent = msg;
        el.classList.remove('hidden');
    }

    document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const identifier = document.getElementById('identifier').value.trim();
        const password = document.getElementById('password').value;
        const btn = document.getElementById('login-btn');

        if (!identifier || !password) {
            showError('Email/username and password are required.');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Signing in…';
        document.getElementById('login-error').classList.add('hidden');

        try {
            await initDpopKeys();

            const loginUrl = window.location.origin + '/api/v1/platform/iam/login';
            const dpopProof = await createDpopProof('POST', loginUrl);

            const res = await fetch(loginUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'DPoP': dpopProof
                },
                body: JSON.stringify({ email: identifier, password })
            });

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || 'Invalid email/username or password.');
            }

            const data = await res.json();

            // Wipe all prior auth state so a fresh login never inherits stale tokens.
            // 1. Expire old HttpOnly cookies from the pre-DPoP flow
            document.cookie = 'cveil_access=; path=/; max-age=0; SameSite=Lax';
            document.cookie = 'cveil_refresh=; path=/; max-age=0; SameSite=Lax';
            // 2. Expire the lightweight session cookie (may belong to a different user)
            document.cookie = 'cveil_session=; path=/; max-age=0; SameSite=Lax';
            // 3. Clear previous sessionStorage tokens and DPoP key pair
            sessionStorage.removeItem('cveil_access_token');
            sessionStorage.removeItem('cveil_refresh_token');
            sessionStorage.removeItem('cveil_token_type');
            sessionStorage.removeItem('cveil_expires_at');
            sessionStorage.removeItem(DPOP_STORAGE_KEY);

            // Store fresh tokens for the DPoP-enabled dashboard
            sessionStorage.setItem('cveil_access_token', data.accessToken);
            sessionStorage.setItem('cveil_refresh_token', data.refreshToken);
            sessionStorage.setItem('cveil_token_type', data.tokenType || 'DPoP');
            sessionStorage.setItem('cveil_expires_at',
                String(Date.now() + (data.expiresIn || 900) * 1000));

            // Decode JWT payload to extract user context for server-rendered pages
            const jwtParts = data.accessToken.split('.');
            let sub = data.subject || '';
            let username = data.subject;
            let email = '';
            if (jwtParts.length === 3) {
                try {
                    const payload = JSON.parse(atob(jwtParts[1].replace(/-/g,'+').replace(/_/g,'/')));
                    sub = payload.sub || data.subject || '';
                    username = payload.preferred_username || payload.sub || data.subject;
                    email = payload.email || '';
                } catch { /* use fallback values */ }
            }

            // Store lightweight session cookie for server-rendered template context.
            // Includes 's' (Keycloak sub/UUID) so server-side org lookup works.
            var securePart = location.protocol === 'https:' ? '; Secure' : '';
            document.cookie = 'cveil_session=' + btoa(JSON.stringify({
                u: username,
                e: email,
                s: sub,
                t: data.tokenType || 'DPoP'
            })) + '; path=/; SameSite=Lax' + securePart + '; max-age=' + (data.expiresIn || 900);

            window.location.href = '/dashboard';
        } catch (err) {
            showError(err.message || 'An unexpected error occurred. Please try again.');
            btn.disabled = false;
            btn.textContent = 'Sign In';
        }
    });
    </script>

{/content}
{/include}
