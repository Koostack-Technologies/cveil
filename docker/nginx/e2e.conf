upstream site {
    server cveil-site:8081;
}
upstream api {
    server cveil-api:8080;
}

server {
    listen 80;

    # -- Core API endpoints → cveil-rest-api ----------------------------------
    location /api/v1/consent   { proxy_pass http://api; }
    location /api/v1/subjects  { proxy_pass http://api; }
    location /api/v1/governance { proxy_pass http://api; }
    location /api/v1/catalogue { proxy_pass http://api; }
    location /api/v1/dsar      { proxy_pass http://api; }
    location /api/v1/webhooks  { proxy_pass http://api; }
    location /api/v1/public    { proxy_pass http://api; }
    location /api/v1/platform/metrics { proxy_pass http://api; }
    location /api/v1/platform/docs    { proxy_pass http://api; }
    location /api/v1/metrics   { proxy_pass http://api; }
    location /api/v1/health    { proxy_pass http://api; }
    location /api/v1/banner    { proxy_pass http://api; }
    location /api/v1/reports   { proxy_pass http://api; }
    location /api/v1/docs      { proxy_pass http://api; }

    # -- Platform admin endpoints → cveil-site --------------------------------
    location /api/v1/billing       { proxy_pass http://site; }
    location /api/v1/platform/iam  { proxy_pass http://site; }
    location /api/v1/platform/tenants { proxy_pass http://api; }

    # -- SSE / WebSocket support ----------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_buffering off;
    proxy_read_timeout 300s;

    # -- Everything else (pages, static assets) → cveil-site ------------------
    location / {
        proxy_pass http://site;
    }
}
