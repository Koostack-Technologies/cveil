# =============================================================================
# Operio REST API — Local Development Docker Compose
#
# Spins up the full Operio stack for local development and testing:
#
#   - operio-api:  Quarkus REST API (built from source)
#   - postgres:    PostgreSQL 16 with TLS (consent + platform schemas)
#   - redis:       Redis 7 with TLS (consent decision cache + rate limiting)
#
# Prerequisites:
#
#   # Generate local TLS certificates (only needed once):
#   ./certs/local/generate-certs.sh
#
# Usage:
#
#   # Build and start all services:
#   docker compose up --build
#
#   # Start infrastructure only (run the API from your IDE):
#   docker compose up postgres redis
#
#   # Tear down and remove volumes:
#   docker compose down -v
#
# The bootstrap key is pre-configured for local development.  Use it to
# create the first tenant and API key:
#
#   curl -X POST http://localhost:8080/api/v1/platform/tenants \
#     -H "Authorization: Bearer opr_bootstrap_localdev_do_not_use_in_prod" \
#     -H "Content-Type: application/json" \
#     -d '{"tenantId": "dev_tenant", "displayName": "Dev Tenant", "plan": "free"}'
#
#   curl -X POST http://localhost:8080/api/v1/platform/api-keys \
#     -H "Authorization: Bearer opr_bootstrap_localdev_do_not_use_in_prod" \
#     -H "Content-Type: application/json" \
#     -d '{"tenantId": "dev_tenant", "subject": "dev-admin", "roles": ["admin", "consent-writer"]}'
#
# =============================================================================

name: operio

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — consent schema + platform schema (TLS enabled)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    # Copy mounted certs with correct ownership/permissions, then start Postgres
    # with TLS enabled.  The postgres user is uid 70 in Alpine.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /tmp/pg-certs
        cp /certs-src/pg-server.crt /tmp/pg-certs/server.crt
        cp /certs-src/pg-server.key /tmp/pg-certs/server.key
        cp /certs-src/ca.crt        /tmp/pg-certs/ca.crt
        chown 70:70 /tmp/pg-certs/*
        chmod 600   /tmp/pg-certs/server.key
        chmod 644   /tmp/pg-certs/server.crt /tmp/pg-certs/ca.crt
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/tmp/pg-certs/server.crt \
          -c ssl_key_file=/tmp/pg-certs/server.key \
          -c ssl_ca_file=/tmp/pg-certs/ca.crt
    environment:
      POSTGRES_DB: operio
      POSTGRES_USER: operio
      POSTGRES_PASSWORD: operio_local_dev
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./certs/local:/certs-src:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operio -d operio"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis — consent decision cache + rate limiting (TLS enabled)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - redis-server
      - "--tls-port"
      - "6379"
      - "--port"
      - "0"
      - "--tls-cert-file"
      - "/certs/redis-server.crt"
      - "--tls-key-file"
      - "/certs/redis-server.key"
      - "--tls-ca-cert-file"
      - "/certs/ca.crt"
      - "--tls-auth-clients"
      - "no"
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
    volumes:
      - redisdata:/data
      - ./certs/local:/certs:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cacert", "/certs/ca.crt", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Operio REST API — Quarkus application
  # ---------------------------------------------------------------------------
  operio-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_STRATEGY: quarkus
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # -- Quarkus runtime configuration -----------------------------------
      QUARKUS_HTTP_PORT: "8080"
      QUARKUS_HTTP_HOST: "0.0.0.0"
      QUARKUS_VIRTUAL_THREADS_ENABLED: "true"

      # -- CORS (allow local dashboard development) ------------------------
      OPERIO_CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"

      # -- Operio SDK configuration ----------------------------------------
      OPERIO_MODE: "production"
      OPERIO_APP_NAME: "operio-local"

      # -- Consent database (jOOQ admin + sync layer) ----------------------
      OPERIO_DB_URL: "jdbc:postgresql://postgres:5432/operio"
      OPERIO_DB_DIALECT: "POSTGRES"
      OPERIO_DB_USERNAME: "operio"
      OPERIO_DB_PASSWORD: "operio_local_dev"
      OPERIO_DB_SSL_MODE: "require"

      # -- Platform database (tenant management, API keys) -----------------
      OPERIO_PLATFORM_DB_URL: "jdbc:postgresql://postgres:5432/operio"
      OPERIO_PLATFORM_DB_DIALECT: "POSTGRES"
      OPERIO_PLATFORM_DB_USERNAME: "operio"
      OPERIO_PLATFORM_DB_PASSWORD: "operio_local_dev"
      OPERIO_PLATFORM_DB_SSL_MODE: "require"

      # -- Redis (consent decision cache + rate limiting) ------------------
      OPERIO_REDIS_HOST: "redis"
      OPERIO_REDIS_PORT: "6379"
      OPERIO_REDIS_TLS_ENABLED: "true"
      OPERIO_REDIS_TLS_CA_CERT_PATH: "/certs/ca.crt"
      OPERIO_REDIS_TLS_VERIFY_PEER: "true"

      # -- Bootstrap key (local development only!) -------------------------
      OPERIO_BOOTSTRAP_KEY: "opr_bootstrap_localdev_do_not_use_in_prod"
      OPERIO_FORCE_BOOTSTRAP: "false"

      # -- JVM tuning (local dev — generous limits) ------------------------
      JAVA_OPTS: >-
        -XX:+UseZGC
        -Xms256m
        -Xmx1g
        --enable-preview
        -Dquarkus.log.level=INFO
        -Dquarkus.log.category."com.koostack.operio".level=DEBUG
    volumes:
      - ./certs/local:/certs:ro
    healthcheck:
      test:
        ["CMD-SHELL", "curl -sf http://localhost:8080/q/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

# =============================================================================
# Volumes
# =============================================================================
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
