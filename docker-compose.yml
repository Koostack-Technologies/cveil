# =============================================================================
# Cveil REST API — Local Development Docker Compose
#
# Spins up the full Cveil stack for local development and testing:
#
#   - cveil-api:  Quarkus REST API (built from source)
#   - postgres:    PostgreSQL 16 with TLS (consent + platform schemas)
#   - redis:       Redis 7 with TLS (consent decision cache + rate limiting)
#
# Prerequisites:
#
#   # Generate local TLS certificates (only needed once):
#   ./certs/local/generate-certs.sh
#
# Usage:
#
#   # Build and start all services:
#   docker compose up --build
#
#   # Start infrastructure only (run the API from your IDE):
#   docker compose up postgres redis
#
#   # Tear down and remove volumes:
#   docker compose down -v
#
# The bootstrap key is pre-configured for local development.  Use it to
# create the first tenant and API key:
#
#   curl -X POST http://localhost:8080/api/v1/platform/tenants \
#     -H "Authorization: Bearer opr_bootstrap_localdev_do_not_use_in_prod" \
#     -H "Content-Type: application/json" \
#     -d '{"tenantId": "dev_tenant", "displayName": "Dev Tenant", "plan": "free"}'
#
#   curl -X POST http://localhost:8080/api/v1/platform/api-keys \
#     -H "Authorization: Bearer opr_bootstrap_localdev_do_not_use_in_prod" \
#     -H "Content-Type: application/json" \
#     -d '{"tenantId": "dev_tenant", "subject": "dev-admin", "roles": ["admin", "consent-writer"]}'
#
# =============================================================================

name: cveil

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — consent schema + platform schema (TLS enabled)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    # Copy mounted certs with correct ownership/permissions, then start Postgres
    # with TLS enabled.  The postgres user is uid 70 in Alpine.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /tmp/pg-certs
        cp /certs-src/pg-server.crt /tmp/pg-certs/server.crt
        cp /certs-src/pg-server.key /tmp/pg-certs/server.key
        cp /certs-src/ca.crt        /tmp/pg-certs/ca.crt
        chown 70:70 /tmp/pg-certs/*
        chmod 600   /tmp/pg-certs/server.key
        chmod 644   /tmp/pg-certs/server.crt /tmp/pg-certs/ca.crt
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/tmp/pg-certs/server.crt \
          -c ssl_key_file=/tmp/pg-certs/server.key \
          -c ssl_ca_file=/tmp/pg-certs/ca.crt
    environment:
      POSTGRES_DB: cveil
      POSTGRES_USER: cveil
      POSTGRES_PASSWORD: cveil_local_dev
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./certs/local:/certs-src:ro
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cveil -d cveil"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis — consent decision cache + rate limiting (TLS enabled)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - redis-server
      - "--tls-port"
      - "6379"
      - "--port"
      - "0"
      - "--tls-cert-file"
      - "/certs/redis-server.crt"
      - "--tls-key-file"
      - "/certs/redis-server.key"
      - "--tls-ca-cert-file"
      - "/certs/ca.crt"
      - "--tls-auth-clients"
      - "no"
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
    volumes:
      - redisdata:/data
      - ./certs/local:/certs:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cacert", "/certs/ca.crt", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Keycloak — Identity Provider (platform + per-tenant realms)
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.8
    restart: unless-stopped
    ports:
      - "8180:8080"
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/cveil"
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: cveil
      KC_DB_PASSWORD: cveil_local_dev
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_FEATURES: "token-exchange,admin-fine-grained-authz,organization"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Cveil REST API — Quarkus application
  # ---------------------------------------------------------------------------
  cveil-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_STRATEGY: quarkus
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      # -- Quarkus runtime configuration -----------------------------------
      QUARKUS_HTTP_PORT: "8080"
      QUARKUS_HTTP_HOST: "0.0.0.0"
      QUARKUS_VIRTUAL_THREADS_ENABLED: "true"

      # -- CORS (allow local dashboard development) ------------------------
      CVEIL_CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"

      # -- Cveil SDK configuration ----------------------------------------
      CVEIL_MODE: "production"
      CVEIL_APP_NAME: "cveil-local"

      # -- Consent database (jOOQ admin + sync layer) ----------------------
      CVEIL_DB_URL: "jdbc:postgresql://postgres:5432/cveil"
      CVEIL_DB_DIALECT: "POSTGRES"
      CVEIL_DB_USERNAME: "cveil"
      CVEIL_DB_PASSWORD: "cveil_local_dev"
      CVEIL_DB_SSL_MODE: "require"

      # -- Redis (consent decision cache + rate limiting) ------------------
      CVEIL_REDIS_HOST: "redis"
      CVEIL_REDIS_PORT: "6379"
      CVEIL_REDIS_TLS_ENABLED: "true"
      CVEIL_REDIS_TLS_CA_CERT_PATH: "/certs/ca.crt"
      CVEIL_REDIS_TLS_VERIFY_PEER: "true"

      # -- Bootstrap key (local development only!) -------------------------
      CVEIL_BOOTSTRAP_KEY: "opr_bootstrap_localdev_do_not_use_in_prod"
      CVEIL_FORCE_BOOTSTRAP: "false"

      # -- Keycloak (identity provider) ------------------------------------
      CVEIL_KEYCLOAK_URL: "http://keycloak:8080"
      CVEIL_KEYCLOAK_ADMIN_USERNAME: "admin"
      CVEIL_KEYCLOAK_ADMIN_PASSWORD: "admin"
      CVEIL_KEYCLOAK_CLIENT_ID: "cveil-backend"
      CVEIL_KEYCLOAK_ROOT_EMAIL: "admin@cveil.local"
      CVEIL_KEYCLOAK_ROOT_PASSWORD: "admin"

      # -- SMTP for Keycloak realm emails (invitations, verification) ------
      CVEIL_KEYCLOAK_SMTP_HOST: "smtp.gmail.com"
      CVEIL_KEYCLOAK_SMTP_PORT: "587"
      CVEIL_KEYCLOAK_SMTP_FROM: "koostacktech@gmail.com"
      CVEIL_KEYCLOAK_SMTP_USER: "koostacktech@gmail.com"
      CVEIL_KEYCLOAK_SMTP_PASSWORD: "jtlcywxzufwsunsx"

      # -- Stripe API key (for testing Stripe integration in the dashboard) ----------
      CVEIL_STRIPE_SECRET_KEY: sk_test_51TB2Tx0hZvbJkvbUlp4her8bZpDfoIb7PX7UFQk9ehOlJYOJ3IspMnJj6EG0cu5lmBVe34uOpMzmYJNP7K9KUoVP004tz0CGbR
      CVEIL_STRIPE_PUBLISHABLE_KEY: pk_test_51TB2Tx0hZvbJkvbUJUzsIHu7drjwMVFN5DKEOeHaQSyVX2VaMp6flaazTdLZO7yTDW2QH8UJBTqqvpLhiItBCleq00E6b3aQIi
      # CVEIL_STRIPE_WEBHOOK_SECRET=whsec_xxx

      # -- JVM tuning (local dev — generous limits) ------------------------
      JAVA_OPTS: >-
        -XX:+UseZGC
        -Xms256m
        -Xmx1g
        --enable-preview
        -Dquarkus.log.level=INFO
        -Dquarkus.log.category."com.koostack.cveil".level=DEBUG
    volumes:
      - ./certs/local:/certs:ro
    healthcheck:
      test:
        ["CMD-SHELL", "curl -sf http://localhost:8080/q/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

# =============================================================================
# Volumes
# =============================================================================
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
