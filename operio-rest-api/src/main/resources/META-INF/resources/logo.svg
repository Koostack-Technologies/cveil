<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <rect id="bg" width="500" height="550" fill="#0F172A" rx="40" />

    <linearGradient id="consentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" /> <stop offset="100%" stop-color="#4F46E5" /> </linearGradient>

    <linearGradient id="veilLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.9" /> <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.8" /> </linearGradient>

    <linearGradient id="veilRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.9" /> <stop offset="100%" stop-color="#312E81" stop-opacity="0.85" /> </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <use href="#bg" />

  <circle cx="250" cy="240" r="35" fill="#F59E0B" filter="url(#glow)" />
  <circle cx="250" cy="240" r="15" fill="#FFFBEB" />

  <path d="M 370 130 A 170 170 0 1 0 370 370" fill="none" stroke="url(#consentGradient)" stroke-width="50" stroke-linecap="round" filter="url(#shadow)" />

  <path d="M 150 130 L 250 370" fill="none" stroke="url(#veilLeft)" stroke-width="55" stroke-linecap="round" filter="url(#shadow)" />
  
  <path d="M 350 130 L 250 370" fill="none" stroke="url(#veilRight)" stroke-width="55" stroke-linecap="round" filter="url(#shadow)" />

  <text x="250" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" text-anchor="middle" letter-spacing="1">
    <tspan fill="#F8FAFC">Consent</tspan><tspan fill="#38BDF8">Veil</tspan>
  </text>
</svg>
