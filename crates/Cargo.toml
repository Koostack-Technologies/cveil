[workspace]
resolver = "2"
members = [
    "cveil-sdk-core",
    "cveil-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/koostacktech/cveil"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
