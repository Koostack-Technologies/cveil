# =============================================================================
# Cveil Infrastructure — Provision and deploy supporting services to Railway
#
# Provisions Postgres, Redis, nginx reverse proxy, and Keycloak.
# Postgres and Redis are Railway managed plugins; nginx and Keycloak are
# custom Docker images pushed to GHCR.
#
# Environment is derived from the branch/tag the workflow is dispatched from:
#   develop → dev   |   main → stage   |   tag → prod
# =============================================================================

name: "Deploy: Infrastructure"

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Which services to deploy"
        required: true
        type: choice
        options:
          - all
          - databases
          - postgres
          - redis
          - nginx
          - keycloak
      confirm_prod:
        description: "Type 'yes-deploy-prod' to confirm production deployment (only needed on tags)"
        required: false
        type: string

concurrency:
  group: deploy-infra-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Gate — resolve environment from branch/tag and validate
  # ---------------------------------------------------------------------------
  gate:
    name: Resolve & Gate
    runs-on: ubuntu-latest
    outputs:
      railway_env_id: ${{ steps.resolve.outputs.env_id }}
      environment_name: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Resolve environment from ref
        id: resolve
        run: |
          REF="${{ github.ref_name }}"

          if [ "$REF" = "develop" ]; then
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "env_id=${{ vars.RAILWAY_DEV_ENV_ID }}" >> "$GITHUB_OUTPUT"
          elif [ "$REF" = "main" ]; then
            echo "environment=stage" >> "$GITHUB_OUTPUT"
            echo "env_id=${{ vars.RAILWAY_STAGE_ENV_ID }}" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == api-v* ]] || [[ "$REF" == site-v* ]] || [[ "$REF" == v* ]]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
            echo "env_id=${{ vars.RAILWAY_PROD_ENV_ID }}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Infra deploy must run from 'develop' (→dev), 'main' (→stage), or a tag (→prod). Got: $REF"
            exit 1
          fi

      - name: Validate production confirmation
        if: steps.resolve.outputs.environment == 'prod' && inputs.confirm_prod != 'yes-deploy-prod'
        run: |
          echo "::error::Production deployment requires confirm_prod = 'yes-deploy-prod'"
          exit 1

  # ---------------------------------------------------------------------------
  # Postgres — provision managed plugin + initialise schemas
  # ---------------------------------------------------------------------------
  postgres:
    name: "Postgres: Provision & Init"
    runs-on: ubuntu-latest
    needs: gate
    if: contains(fromJSON('["all","databases","postgres"]'), inputs.services)
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Debug Railway auth
        run: |
          railway --version
          echo "Token length: ${#RAILWAY_API_TOKEN}"
          railway whoami
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      - name: Link Railway project
        run: railway link --project "${{ vars.RAILWAY_PROJECT_ID }}" --environment "${{ needs.gate.outputs.railway_env_id }}"
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      - name: Provision Postgres plugin (idempotent)
        run: |
          # Check if the Postgres service already exists
          if railway status --json | jq -e '.services[] | select(.name | test("postgres"; "i"))' > /dev/null 2>&1; then
            echo "✅ Postgres service already exists — skipping creation"
          else
            echo "Creating Postgres plugin..."
            railway add --database postgres
            echo "✅ Postgres plugin created"
            echo "Waiting for Postgres to be ready..."
            sleep 30
          fi
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      - name: Fetch DATABASE_URL from Railway
        id: pg-url
        run: |
          # Re-link to the Postgres service to read its variables
          railway link --service Postgres
          DB_URL=$(railway variables --json | jq -r '.DATABASE_URL // empty')
          if [ -z "$DB_URL" ]; then
            echo "::error::Could not retrieve DATABASE_URL from Railway Postgres service"
            exit 1
          fi
          echo "::add-mask::$DB_URL"
          echo "database_url=$DB_URL" >> "$GITHUB_OUTPUT"
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create cveil database (idempotent)
        run: |
          # Connect to the default 'railway' database to create 'cveil'
          psql "$DATABASE_URL" -tc "SELECT 1 FROM pg_database WHERE datname = 'cveil'" | grep -q 1 \
            || psql "$DATABASE_URL" -c "CREATE DATABASE cveil"
          echo "✅ Database 'cveil' exists"
        env:
          DATABASE_URL: ${{ steps.pg-url.outputs.database_url }}

      - name: Create keycloak schema
        run: |
          # Switch to the cveil database for schema init
          CVEIL_URL=$(echo "$DATABASE_URL" | sed 's|/railway|/cveil|')
          psql "$CVEIL_URL" -f docker/postgres/init-keycloak-schema.sql
        env:
          DATABASE_URL: ${{ steps.pg-url.outputs.database_url }}

      - name: Verify schemas
        run: |
          CVEIL_URL=$(echo "$DATABASE_URL" | sed 's|/railway|/cveil|')
          psql "$CVEIL_URL" -c "SELECT schema_name FROM information_schema.schemata WHERE schema_name IN ('public', 'keycloak') ORDER BY schema_name;"
        env:
          DATABASE_URL: ${{ steps.pg-url.outputs.database_url }}

  # ---------------------------------------------------------------------------
  # Redis — provision managed plugin
  # ---------------------------------------------------------------------------
  redis:
    name: "Redis: Provision"
    runs-on: ubuntu-latest
    needs: gate
    if: contains(fromJSON('["all","databases","redis"]'), inputs.services)
    timeout-minutes: 10
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Link Railway project
        run: railway link --project "${{ vars.RAILWAY_PROJECT_ID }}" --environment "${{ needs.gate.outputs.railway_env_id }}"
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      - name: Provision Redis plugin (idempotent)
        run: |
          if railway status --json | jq -e '.services[] | select(.name | test("redis"; "i"))' > /dev/null 2>&1; then
            echo "✅ Redis service already exists — skipping creation"
          else
            echo "Creating Redis plugin..."
            railway add --database redis
            echo "✅ Redis plugin created"
            sleep 15
          fi
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      - name: Verify Redis connectivity
        run: |
          # Link to the Redis service to read its variables
          railway link --service Redis
          REDIS_URL=$(railway variables --json | jq -r '.REDIS_URL // empty')
          if [ -n "$REDIS_URL" ]; then
            echo "✅ Redis URL is set — plugin is provisioned"
          else
            echo "⚠️ REDIS_URL not yet available — plugin may still be provisioning"
          fi
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

  # ---------------------------------------------------------------------------
  # Nginx — build, push, deploy reverse proxy
  # ---------------------------------------------------------------------------
  nginx:
    name: "Nginx: Deploy"
    runs-on: ubuntu-latest
    needs: gate
    if: inputs.services == 'all' || inputs.services == 'nginx'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/proxy
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/nginx/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Link Railway service
        run: railway link --project "${{ vars.RAILWAY_PROJECT_ID }}" --environment "${{ needs.gate.outputs.railway_env_id }}" --service "${{ vars.RAILWAY_NGINX_SERVICE_ID }}"
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      - name: Deploy to Railway
        run: |
          railway variable set \
            "API_HOST=${{ vars[format('RAILWAY_{0}_API_PRIVATE_HOST', needs.gate.outputs.environment_name)] }}" \
            "API_PORT=${{ vars[format('RAILWAY_{0}_API_PORT', needs.gate.outputs.environment_name)] || '8080' }}" \
            "SITE_HOST=${{ vars[format('RAILWAY_{0}_SITE_PRIVATE_HOST', needs.gate.outputs.environment_name)] }}" \
            "SITE_PORT=${{ vars[format('RAILWAY_{0}_SITE_PORT', needs.gate.outputs.environment_name)] || '8081' }}"
          railway up --detach
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

  # ---------------------------------------------------------------------------
  # Keycloak — build, push, deploy identity provider
  # ---------------------------------------------------------------------------
  keycloak:
    name: "Keycloak: Deploy"
    runs-on: ubuntu-latest
    needs: gate
    if: inputs.services == 'all' || inputs.services == 'keycloak'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/keycloak
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/keycloak/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Link Railway service
        run: railway link --project "${{ vars.RAILWAY_PROJECT_ID }}" --environment "${{ needs.gate.outputs.railway_env_id }}" --service "${{ vars.RAILWAY_KEYCLOAK_SERVICE_ID }}"
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      - name: Deploy to Railway
        run: railway up --detach
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

  # ---------------------------------------------------------------------------
  # Summary
  # ---------------------------------------------------------------------------
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [gate, postgres, redis, nginx, keycloak]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Infrastructure Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | **${{ needs.gate.outputs.environment_name }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Postgres | ${{ needs.postgres.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Redis | ${{ needs.redis.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Nginx | ${{ needs.nginx.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Keycloak | ${{ needs.keycloak.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
