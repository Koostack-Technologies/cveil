# =============================================================================
# Cveil — Unit Tests
#
# Runs all fast, isolated unit tests that do NOT require external services
# (no Docker, no databases, no network calls).
#
# Includes:
#   - Java/JVM unit tests (*Test.java) across all Gradle subprojects
#   - Rust unit tests (inline #[test] in cveil-sdk-core and cveil-cli)
#
# Triggers:
#   - Push to main/develop branches
#   - Pull requests targeting main/develop
#   - Manual dispatch
# =============================================================================

name: Unit Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Java / JVM unit tests
  # ---------------------------------------------------------------------------
  java-unit:
    name: Java Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (exclude *IT)
        run: ./gradlew test -PunitOnly --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-unit-test-reports
          path: '**/build/reports/tests/test/'
          retention-days: 14

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-unit-test-results
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Rust unit tests
  # ---------------------------------------------------------------------------
  rust-unit:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: rust-unit-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: rust-unit-${{ runner.os }}-

      - name: Run Rust unit tests
        working-directory: crates
        run: cargo test --lib --workspace
