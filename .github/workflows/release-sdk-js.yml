# =============================================================================
# Cveil — JavaScript SDK Release
#
# Runs semantic-release for the JS SDK on push to main when SDK files change.
# Builds WASM from Rust + TypeScript, then publishes to npm.
#
# Required secrets (passed via env vars):
#   NPM_TOKEN — npm registry auth token
# =============================================================================

name: "Release: JS SDK"

on:
  push:
    branches: [main]
    paths:
      - 'sdks/cveil-sdk-js/**'
      - 'crates/cveil-sdk-core/**'
  workflow_dispatch:

concurrency:
  group: release-sdk-js
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Semantic Release
  # ---------------------------------------------------------------------------
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install semantic-release
        run: |
          npm install --save-dev \
            semantic-release@latest \
            @semantic-release/exec@latest \
            @semantic-release/github@latest \
            @semantic-release/commit-analyzer@latest \
            @semantic-release/release-notes-generator@latest \
            conventional-changelog-conventionalcommits@latest

      - name: Run semantic-release
        id: semantic
        run: npx semantic-release --extends ./sdks/cveil-sdk-js/.releaserc.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Build WASM + TypeScript, publish to npm
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (for WASM build)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build SDK (WASM + TypeScript)
        working-directory: sdks/cveil-sdk-js
        run: |
          npm ci
          npm run build

      - name: Set package version
        working-directory: sdks/cveil-sdk-js
        run: npm version ${{ needs.release.outputs.new_release_version }} --no-git-tag-version

      - name: Publish to npm
        working-directory: sdks/cveil-sdk-js
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
