# =============================================================================
# Cveil — E2E Tests (Playwright)
#
# Runs the full Playwright end-to-end test suite against a running Cveil
# instance.  Can target:
#   - A freshly-built local Docker Compose stack (default)
#   - An external deployment via configurable BASE_URL
#
# Inputs (workflow_dispatch):
#   base_url       — Target URL (default: http://localhost:8080)
#   deploy_stack   — Whether to build and start Docker Compose (default: true)
#
# Triggers:
#   - Push to main/develop branches
#   - Pull requests targeting main/develop
#   - Manual dispatch with configurable target
# =============================================================================

name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target URL for E2E tests'
        required: false
        default: 'http://localhost:8080'
        type: string
      deploy_stack:
        description: 'Build and start the Docker Compose stack'
        required: false
        default: true
        type: boolean

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: ${{ inputs.base_url || 'http://localhost:8080' }}

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # -----------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 2. Build and start Docker Compose stack (if enabled)
      # -----------------------------------------------------------------
      - name: Set up Docker Buildx
        if: inputs.deploy_stack != false
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: inputs.deploy_stack != false
        run: docker compose build cveil-api
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1

      - name: Start Docker Compose stack
        if: inputs.deploy_stack != false
        run: |
          docker compose up -d
          echo "Stack started — waiting for health..."

      - name: Wait for API health
        if: inputs.deploy_stack != false
        run: |
          echo "Polling ${BASE_URL}/q/health/ready ..."
          attempts=0
          max_attempts=40
          while [ $attempts -lt $max_attempts ]; do
            if curl -sf "${BASE_URL}/q/health/ready" > /dev/null 2>&1; then
              echo "✅ Backend healthy after $((attempts * 5))s"
              exit 0
            fi
            attempts=$((attempts + 1))
            echo "  Attempt ${attempts}/${max_attempts} — retrying in 5s..."
            sleep 5
          done
          echo "❌ Backend not healthy within $((max_attempts * 5))s"
          docker compose logs cveil-api --tail 200
          exit 1

      # -----------------------------------------------------------------
      # 3. Set up Node.js and install E2E dependencies
      # -----------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # -----------------------------------------------------------------
      # 4. Run Playwright tests
      # -----------------------------------------------------------------
      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test
        env:
          BASE_URL: ${{ env.BASE_URL }}
          CI: 'true'

      # -----------------------------------------------------------------
      # 5. Upload artifacts
      # -----------------------------------------------------------------
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/test-results/
          retention-days: 14

      # -----------------------------------------------------------------
      # 6. Cleanup
      # -----------------------------------------------------------------
      - name: Dump container logs on failure
        if: failure() && inputs.deploy_stack != false
        run: |
          echo "=== cveil-api ==="
          docker compose logs cveil-api --tail 300 2>&1 || true
          echo "=== postgres ==="
          docker compose logs postgres --tail 50 2>&1 || true
          echo "=== redis ==="
          docker compose logs redis --tail 50 2>&1 || true

      - name: Tear down Docker Compose
        if: always() && inputs.deploy_stack != false
        run: docker compose down -v --remove-orphans 2>&1 || true
