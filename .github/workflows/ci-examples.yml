# =============================================================================
# Cveil — SDK Examples
#
# Runs the Java and JavaScript SDK example suites against a Cveil instance.
# Each example creates resources, exercises the SDK, and cleans up after
# itself.
#
# Fully configurable via workflow_dispatch inputs:
#   api_url        — Cveil API base URL
#   api_token      — API bearer token (use a GitHub secret for real tokens)
#   jurisdiction   — Default jurisdiction code (EU, US, BR, etc.)
#   deploy_stack   — Whether to build and start Docker Compose locally
#
# When deploy_stack is true, the workflow provisions a fresh tenant and
# API key automatically.  When false, you must supply api_token.
#
# Triggers:
#   - Push to main/develop branches
#   - Pull requests targeting main/develop
#   - Manual dispatch with configurable target
# =============================================================================

name: SDK Examples

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Cveil API base URL'
        required: false
        default: 'http://localhost:8080'
        type: string
      api_token:
        description: 'API bearer token (leave empty to auto-provision)'
        required: false
        default: ''
        type: string
      jurisdiction:
        description: 'Default jurisdiction code'
        required: false
        default: 'EU'
        type: string
      deploy_stack:
        description: 'Build and start the Docker Compose stack'
        required: false
        default: true
        type: boolean

concurrency:
  group: ci-examples-${{ github.ref }}
  cancel-in-progress: true

env:
  CVEIL_API_URL: ${{ inputs.api_url || 'http://localhost:8080' }}
  CVEIL_JURISDICTION: ${{ inputs.jurisdiction || 'EU' }}
  BOOTSTRAP_KEY: 'opr_bootstrap_localdev_do_not_use_in_prod'

jobs:
  examples:
    name: Run SDK Examples
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # -----------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 2. Build and start Docker Compose stack (if enabled)
      # -----------------------------------------------------------------
      - name: Set up Docker Buildx
        if: inputs.deploy_stack != false
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: inputs.deploy_stack != false
        run: docker compose build cveil-api
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1

      - name: Start Docker Compose stack
        if: inputs.deploy_stack != false
        run: |
          docker compose up -d
          echo "Stack started — waiting for health..."

      - name: Wait for API health
        if: inputs.deploy_stack != false
        run: |
          echo "Polling ${CVEIL_API_URL}/q/health/ready ..."
          attempts=0
          max_attempts=40
          while [ $attempts -lt $max_attempts ]; do
            if curl -sf "${CVEIL_API_URL}/q/health/ready" > /dev/null 2>&1; then
              echo "✅ Backend healthy after $((attempts * 5))s"
              exit 0
            fi
            attempts=$((attempts + 1))
            echo "  Attempt ${attempts}/${max_attempts} — retrying in 5s..."
            sleep 5
          done
          echo "❌ Backend not healthy within $((max_attempts * 5))s"
          docker compose logs cveil-api --tail 200
          exit 1

      # -----------------------------------------------------------------
      # 3. Provision tenant + API key (when using local stack)
      # -----------------------------------------------------------------
      - name: Provision test tenant and API key
        id: provision
        if: inputs.deploy_stack != false && inputs.api_token == ''
        run: |
          echo "Creating examples tenant..."
          curl -sf -X POST "${CVEIL_API_URL}/api/v1/platform/tenants" \
            -H "Authorization: Bearer ${BOOTSTRAP_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "tenantId": "examples_ci",
              "displayName": "CI Examples Tenant",
              "plan": "free"
            }' | python3 -m json.tool

          echo "Creating API key..."
          response=$(curl -sf -X POST "${CVEIL_API_URL}/api/v1/platform/api-keys" \
            -H "Authorization: Bearer ${BOOTSTRAP_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "tenantId": "examples_ci",
              "subject": "ci-examples-admin",
              "roles": ["admin", "consent-writer", "consent-reader", "super-admin"]
            }')

          raw_key=$(echo "$response" | python3 -c "import json,sys; print(json.load(sys.stdin)['rawKey'])")
          echo "api_key=${raw_key}" >> "$GITHUB_OUTPUT"
          echo "✅ Tenant + API key provisioned"

      - name: Resolve API token
        id: resolve_token
        run: |
          if [ -n "${{ inputs.api_token }}" ]; then
            echo "token=${{ inputs.api_token }}" >> "$GITHUB_OUTPUT"
          else
            echo "token=${{ steps.provision.outputs.api_key }}" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------
      # 4. Java SDK examples
      # -----------------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Java SDK examples
        run: ./gradlew :examples:cveil-java-sdk-examples:run --no-daemon
        env:
          CVEIL_API_URL: ${{ env.CVEIL_API_URL }}
          CVEIL_API_TOKEN: ${{ steps.resolve_token.outputs.token }}
          CVEIL_JURISDICTION: ${{ env.CVEIL_JURISDICTION }}

      # -----------------------------------------------------------------
      # 5. JavaScript SDK examples
      # -----------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust toolchain (for WASM SDK build)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Build JS SDK (WASM + TypeScript)
        working-directory: sdks/cveil-sdk-js
        run: npm ci && npm run build

      - name: Install JS examples dependencies
        working-directory: examples/cveil-js-sdk-examples
        run: npm ci

      - name: Run JS SDK examples
        working-directory: examples/cveil-js-sdk-examples
        run: npm start
        env:
          CVEIL_API_URL: ${{ env.CVEIL_API_URL }}
          CVEIL_API_TOKEN: ${{ steps.resolve_token.outputs.token }}
          CVEIL_JURISDICTION: ${{ env.CVEIL_JURISDICTION }}

      # -----------------------------------------------------------------
      # 6. Cleanup
      # -----------------------------------------------------------------
      - name: Cleanup — delete examples tenant
        if: always() && inputs.deploy_stack != false && inputs.api_token == ''
        run: |
          API_KEY="${{ steps.resolve_token.outputs.token }}"
          if [ -n "$API_KEY" ]; then
            curl -s -X DELETE \
              "${CVEIL_API_URL}/api/v1/platform/tenants/examples_ci" \
              -H "Authorization: Bearer ${API_KEY}" || true
          fi

      - name: Dump container logs on failure
        if: failure() && inputs.deploy_stack != false
        run: |
          echo "=== cveil-api ==="
          docker compose logs cveil-api --tail 300 2>&1 || true
          echo "=== postgres ==="
          docker compose logs postgres --tail 50 2>&1 || true
          echo "=== redis ==="
          docker compose logs redis --tail 50 2>&1 || true

      - name: Tear down Docker Compose
        if: always() && inputs.deploy_stack != false
        run: docker compose down -v --remove-orphans 2>&1 || true
