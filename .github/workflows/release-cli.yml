# =============================================================================
# Cveil — Rust CLI Release
#
# Runs semantic-release for the CLI on push to main when CLI files change.
# Publishes cveil-cli crate to crates.io.
#
# Required secrets (passed via env vars):
#   CARGO_REGISTRY_TOKEN — crates.io API token
# =============================================================================

name: "Release: CLI"

on:
  push:
    branches: [main]
    paths:
      - 'crates/cveil-cli/**'
      - 'crates/cveil-sdk-core/**'
  workflow_dispatch:

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Semantic Release
  # ---------------------------------------------------------------------------
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install semantic-release
        run: |
          npm install --save-dev \
            semantic-release@latest \
            @semantic-release/exec@latest \
            @semantic-release/github@latest \
            @semantic-release/commit-analyzer@latest \
            @semantic-release/release-notes-generator@latest \
            conventional-changelog-conventionalcommits@latest

      - name: Run semantic-release
        id: semantic
        run: npx semantic-release --extends ./crates/cveil-cli/.releaserc.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Publish to crates.io
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: rust-publish-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: rust-publish-${{ runner.os }}-

      - name: Update CLI crate version
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ needs.release.outputs.new_release_version }}\"/" crates/cveil-cli/Cargo.toml

      - name: Publish cveil-sdk-core (if needed)
        working-directory: crates
        run: cargo publish -p cveil-sdk-core --allow-dirty || echo "cveil-sdk-core already published or unchanged"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish cveil-cli
        working-directory: crates
        run: cargo publish -p cveil-cli --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
