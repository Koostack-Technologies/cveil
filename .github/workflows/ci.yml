# =============================================================================
# Cveil — CI Quality Gate
#
# Runs on every PR targeting develop or main. Validates:
#   - Conventional commit format (commitlint)
#   - Java build + Spotless formatting check
#   - Rust build + Clippy lints
#   - Java unit tests (*Test.java, excludes *IT)
#   - Rust unit tests (inline #[test])
#
# All jobs are fast and require NO external services.
# =============================================================================

name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Conventional commit lint
  # ---------------------------------------------------------------------------
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run commitlint
        run: |
          npm install --save-dev @commitlint/cli@latest @commitlint/config-conventional@latest
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # ---------------------------------------------------------------------------
  # Java build + format check + unit tests
  # ---------------------------------------------------------------------------
  java:
    name: Java Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and check formatting
        run: ./gradlew build -PunitOnly -x test --no-daemon

      - name: Spotless check
        run: ./gradlew spotlessCheck --no-daemon

      - name: Run unit tests (exclude *IT)
        run: ./gradlew test -PunitOnly --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-unit-test-reports
          path: '**/build/reports/tests/test/'
          retention-days: 14

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-unit-test-results
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Rust build + clippy + unit tests
  # ---------------------------------------------------------------------------
  rust:
    name: Rust Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: rust-ci-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: rust-ci-${{ runner.os }}-

      - name: Clippy lint
        working-directory: crates
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust unit tests
        working-directory: crates
        run: cargo test --lib --workspace
