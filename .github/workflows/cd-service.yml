# =============================================================================
# Reusable CD — Deploy a Docker image to Railway
#
# Called by cicd.yml for all services (api, site, nginx, keycloak).
# Creates or updates a Railway service via GraphQL API, then redeploys.
# =============================================================================

name: "CD: Service"

on:
  workflow_call:
    inputs:
      service:
        description: "Railway service name (api, site, nginx, keycloak)"
        required: true
        type: string
      image:
        description: "Full Docker image reference (e.g. ghcr.io/org/repo/api:v1.0.0)"
        required: true
        type: string
      project_id:
        description: "Railway project ID"
        required: true
        type: string
      environment_id:
        description: "Railway environment ID"
        required: true
        type: string
      environment_name:
        description: "Environment name for summary (dev, stage, prod)"
        required: false
        type: string
        default: ""
      service_env_vars:
        description: "Space-separated KEY=VALUE pairs to set as Railway service variables"
        required: false
        type: string
        default: ""
    secrets:
      RAILWAY_API_TOKEN:
        required: true

jobs:
  deploy:
    name: "Deploy: ${{ inputs.service }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: |
          IMAGE="${{ inputs.image }}"
          PROJECT_ID="${{ inputs.project_id }}"
          ENV_ID="${{ inputs.environment_id }}"
          SERVICE="${{ inputs.service }}"
          API="https://backboard.railway.com/graphql/v2"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### $SERVICE Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ inputs.environment_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`$IMAGE\`" >> $GITHUB_STEP_SUMMARY

          gql() {
            local RESPONSE
            RESPONSE=$(curl -sf -X POST "$API" \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"$1\"}")
            echo "$RESPONSE"
            if echo "$RESPONSE" | jq -e '.errors' >/dev/null 2>&1; then
              echo "::error::Railway API error: $(echo "$RESPONSE" | jq -r '.errors[0].message')"
              return 1
            fi
          }

          if railway link --project "$PROJECT_ID" --environment "$ENV_ID" --service "$SERVICE" 2>/dev/null; then
            echo "✅ $SERVICE service exists — updating image and redeploying"
            SVC_ID=$(railway status --json 2>/dev/null | jq -r '.serviceId // empty' || true)
            if [ -n "$SVC_ID" ]; then
              gql "mutation { serviceInstanceUpdate(serviceId: \\\"$SVC_ID\\\", environmentId: \\\"$ENV_ID\\\", input: { source: { image: \\\"$IMAGE\\\" } }) }"
            fi
            if [ -n "${{ inputs.service_env_vars }}" ]; then
              railway variable set ${{ inputs.service_env_vars }}
            fi
            railway redeploy --yes
          else
            echo "Creating $SERVICE service from image via API..."
            gql "mutation { serviceCreate(input: { name: \\\"$SERVICE\\\", projectId: \\\"$PROJECT_ID\\\", source: { image: \\\"$IMAGE\\\" } }) { id } }"
            sleep 5
            railway link --project "$PROJECT_ID" --environment "$ENV_ID" --service "$SERVICE"
            if [ -n "${{ inputs.service_env_vars }}" ]; then
              railway variable set ${{ inputs.service_env_vars }}
            fi
            echo "✅ $SERVICE service created and deploying"
          fi

          echo "- **Status:** ✅ Deployed" >> $GITHUB_STEP_SUMMARY
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
